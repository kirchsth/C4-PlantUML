name: Automate Release Process

on:
  workflow_dispatch:
    inputs:
      transformation:
        description: 'Transformation to execute (e.g., UpdateC4WithReleaseVersion)'
        required: true
      release_version:
        description: 'Release version (e.g., v2.6.0)'
        required: true
      next_version:
        description: 'Next version (optional, calculated automatically if left empty)'
        required: true
      deployed_version:
        description: 'Deployed version (optional, calculated automatically if left empty)'
        required: false

jobs:
  automate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r ./.scripts/requirements.txt

      - name: Execute release automation
        env:
          release_version: ${{ github.event.inputs.release_version }}
          next_version: ${{ github.event.inputs.next_version }}
          deployed_version: ${{ github.event.inputs.deployed_version }}
        run: |
          python ./.scripts/transform_files.py UpdateC4WithReleaseVersion
          python ./.scripts/transform_files.py UpdateAllIncludes
          python ./.scripts/transform_files.py UpdateAllImages
          python ./.scripts/transform_files.py ReplaceREADMEHeader

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch
        run: |
          git checkout -b "prerelease/${{ github.event.inputs.release_version }}"

      - name: Check for changes
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "Automated release: ${{ github.event.inputs.release_version }}"

      - name: Push new branch
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git push origin "prerelease/${{ github.event.inputs.release_version }}"

